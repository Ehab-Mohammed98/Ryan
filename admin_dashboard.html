<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم إدارة مدرسة الريان</title>
  <!-- استيراد خط Cairo العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!-- استيراد Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استيراد أيقونات Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
<script src="Css/admin_Dashboard.html" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-[#F4F6F9] text-[#1E293B] antialiased selection:bg-[#0D9488] selection:text-white">

  <!-- حاوية الإشعارات الفورية بدلاً من alert() -->
  <div id="toast-container" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- =========================================================
       1. شاشة تسجيل دخول إدارة المدرسة
  ========================================================== -->
  <section id="login-view" class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-[#071727] via-[#0E1A30] to-[#0b2e33]">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border-t-4 border-[#0D9488] p-6 sm:p-8 fade-in">
      <div class="text-center mb-7">
        <div class="w-16 h-16 rounded-2xl bg-[#E6F7F5] text-[#0D9488] flex items-center justify-center mx-auto mb-4 shadow-sm">
          <i data-lucide="shield-check" class="w-9 h-9"></i>
        </div>
        <span class="inline-block px-3 py-1 rounded-full bg-[#E6F7F5] text-[#0D9488] text-xs font-bold mb-2">
          بوابة الإدارة المدرسية
        </span>
        <h1 class="text-2xl font-extrabold text-[#0E1A30]">تسجيل دخول إدارة مدرسة الريان</h1>
        <p class="text-sm text-[#64748B] mt-1.5">
          إدارة جداول الحصص، الامتحانات، الإعلانات، والرد على أولياء الأمور
        </p>
      </div>

      <form id="admin-login-form" class="space-y-4" novalidate>
        <div>
          <label for="login-email" class="block text-sm font-bold text-[#0E1A30] mb-1.5">
            البريد الإلكتروني الإداري
          </label>
          <div class="relative">
            <input
              type="email"
              id="login-email"
              dir="ltr"
              placeholder="admin@alrayan-school.edu.sa"
              class="w-full h-12 px-4 rounded-xl bg-[#F4F6F9] border border-slate-200 text-sm text-right text-[#0E1A30] outline-none focus:bg-white focus:border-[#0D9488] focus:ring-4 focus:ring-[#0D9488]/15 transition-all"
              required
            />
          </div>
        </div>

        <div>
          <label for="login-password" class="block text-sm font-bold text-[#0E1A30] mb-1.5">
            كلمة المرور
          </label>
          <div class="relative">
            <input
              type="password"
              id="login-password"
              dir="ltr"
              placeholder="••••••••"
              class="w-full h-12 px-4 rounded-xl bg-[#F4F6F9] border border-slate-200 text-sm text-right text-[#0E1A30] outline-none focus:bg-white focus:border-[#0D9488] focus:ring-4 focus:ring-[#0D9488]/15 transition-all"
              required
            />
          </div>
        </div>

        <p id="login-error" class="hidden text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2.5"></p>

        <button
          type="submit"
          class="w-full h-12 rounded-xl bg-[#0D9488] hover:bg-[#0E1A30] text-white font-bold text-sm transition-all shadow-md cursor-pointer flex items-center justify-center gap-2"
        >
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>دخول إلى لوحة التحكم</span>
        </button>
      </form>

      <!-- تعبئة سريعة للتجربة -->
      <div class="mt-6 pt-5 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
        <button
          type="button"
          onclick="fillDemoCredentials()"
          class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-[#E6F7F5] hover:bg-[#0D9488] text-[#0D9488] hover:text-white font-bold transition-colors cursor-pointer flex items-center justify-center gap-1.5"
        >
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>تعبئة سريعة للتجربة</span>
        </button>
        <span class="text-[#64748B]">المستخدم التجريبي: <strong class="text-[#0E1A30]">admin</strong></span>
      </div>
    </div>
  </section>

  <!-- =========================================================
       2. لوحة التحكم الرئيسية بعد تسجيل الدخول
  ========================================================== -->
  <div id="dashboard-view" class="hidden min-h-screen flex bg-[#F4F6F9]">

    <!-- طبقة التعتيم للقائمة الجانبية في الجوال -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-[#071727]/60 z-30 hidden lg:hidden backdrop-blur-xs"></div>

    <!-- الشريط الجانبي التنقلي -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 right-0 z-40 w-72 bg-[#071727] text-white flex flex-col justify-between transition-transform duration-300 translate-x-full lg:translate-x-0 shrink-0 shadow-xl">
      <div>
        <!-- شعار المدرسة في أعلى الشريط الجانبي -->
        <div class="h-20 px-5 flex items-center justify-between border-b border-white/10">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-[#0D9488] text-white flex items-center justify-center shadow-sm">
              <i data-lucide="school" class="w-6 h-6"></i>
            </div>
            <div>
              <h2 class="font-extrabold text-base text-white leading-tight">مدرسة الريان</h2>
              <span class="text-[11px] text-[#2DD4BF] font-bold">لوحة الإدارة المدرسية</span>
            </div>
          </div>
          <button onclick="toggleSidebar(false)" aria-label="إغلاق القائمة" class="lg:hidden p-2 rounded-lg text-slate-300 hover:bg-white/10 cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- بطاقة تعريف المشرف -->
        <div class="mx-4 mt-5 p-3.5 rounded-2xl bg-[#0E1A30] border border-white/10">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#0D9488]/20 text-[#2DD4BF] font-extrabold flex items-center justify-center border border-[#0D9488]/40">
              إ
            </div>
            <div class="min-w-0">
              <p class="text-sm font-extrabold text-white truncate">إدارة مدرسة الريان</p>
              <p class="text-[11px] text-slate-300 truncate">العام الدراسي 1448هـ / 2026م</p>
            </div>
          </div>
        </div>

        <!-- روابط الأقسام -->
        <nav class="px-3.5 mt-6 space-y-1.5" aria-label="أقسام لوحة التحكم">
          <button onclick="switchSection('overview')" data-nav="overview" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold bg-[#0D9488] text-white transition-all cursor-pointer">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>نظرة عامة</span>
          </button>

          <button onclick="switchSection('messages')" data-nav="messages" class="nav-item w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-bold text-slate-300 hover:bg-white/10 hover:text-white transition-all cursor-pointer">
            <span class="flex items-center gap-3">
              <i data-lucide="mail" class="w-4 h-4"></i>
              <span>رسائل أولياء الأمور</span>
            </span>
            <span id="sidebar-new-msgs-count" class="px-2 py-0.5 text-xs rounded-full bg-[#F59E0B] text-[#071727] font-extrabold">0</span>
          </button>

          <button onclick="switchSection('schedules')" data-nav="schedules" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-300 hover:bg-white/10 hover:text-white transition-all cursor-pointer">
            <i data-lucide="calendar-days" class="w-4 h-4"></i>
            <span>جداول الحصص</span>
          </button>

          <button onclick="switchSection('exams')" data-nav="exams" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-300 hover:bg-white/10 hover:text-white transition-all cursor-pointer">
            <i data-lucide="file-clock" class="w-4 h-4"></i>
            <span>مواعيد الامتحانات</span>
          </button>

          <button onclick="switchSection('announcements')" data-nav="announcements" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-300 hover:bg-white/10 hover:text-white transition-all cursor-pointer">
            <i data-lucide="megaphone" class="w-4 h-4"></i>
            <span>الإعلانات المدرسية</span>
          </button>
        </nav>
      </div>

      <!-- أسفل الشريط الجانبي: إعادة ضبط البيانات وتسجيل الخروج -->
      <div class="p-4 border-t border-white/10 space-y-2">
        <button
          type="button"
          onclick="openResetConfirmModal()"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold text-[#F59E0B] bg-[#F59E0B]/10 hover:bg-[#F59E0B]/20 border border-[#F59E0B]/30 transition-colors cursor-pointer"
        >
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          <span>إعادة ضبط البيانات الافتراضية</span>
        </button>

        <button
          type="button"
          onclick="logoutAdmin()"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-400/20 transition-colors cursor-pointer"
        >
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- الشريط العلوي -->
      <header class="h-20 bg-white border-b border-slate-200/80 px-4 sm:px-8 flex items-center justify-between gap-4 sticky top-0 z-20 shadow-2xs">
        <div class="flex items-center gap-3 min-w-0">
          <button
            type="button"
            onclick="toggleSidebar(true)"
            aria-label="فتح القائمة"
            class="lg:hidden p-2.5 rounded-xl bg-[#F4F6F9] text-[#0E1A30] hover:bg-[#E6F7F5] hover:text-[#0D9488] transition-colors cursor-pointer"
          >
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="min-w-0">
            <h1 id="page-title" class="text-lg sm:text-xl font-extrabold text-[#0E1A30] truncate">نظرة عامة</h1>
            <p class="text-xs text-[#64748B] hidden sm:block">مدرسة الريان — نظام متابعة العمليات المدرسية والطلاب</p>
          </div>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <span class="hidden md:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#E6F7F5] text-[#0D9488] text-xs font-extrabold">
            <span class="w-2 h-2 rounded-full bg-[#0D9488]"></span>
            الحفظ التلقائي مفعّل
          </span>
          <button
            type="button"
            onclick="switchSection('messages')"
            class="relative p-2.5 rounded-xl bg-[#F4F6F9] hover:bg-[#E6F7F5] text-[#0E1A30] hover:text-[#0D9488] transition-colors cursor-pointer"
            title="الرسائل الواردة"
          >
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="header-bell-dot" class="hidden absolute top-2 right-2 w-2 h-2 rounded-full bg-[#F59E0B]"></span>
          </button>
        </div>
      </header>

      <!-- منطقة الأقسام -->
      <main class="flex-1 p-4 sm:p-7 max-w-7xl w-full mx-auto space-y-6">

        <!-- ===================================================
             القسم 1: نظرة عامة
        ==================================================== -->
        <section id="section-overview" class="dashboard-section space-y-6 fade-in">
          <!-- 4 بطاقات إحصائيات -->
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70 flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-[#64748B]">عدد الرسائل الواردة</span>
                <h3 id="stat-messages" class="text-2xl font-extrabold text-[#0E1A30] mt-1">0</h3>
                <p id="stat-messages-sub" class="text-xs font-bold text-[#0D9488] mt-1">0 بانتظار الرد</p>
              </div>
              <div class="w-12 h-12 rounded-2xl bg-[#E6F7F5] text-[#0D9488] flex items-center justify-center shrink-0">
                <i data-lucide="mail-open" class="w-6 h-6"></i>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70 flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-[#64748B]">الحصص الأسبوعية</span>
                <h3 id="stat-schedules" class="text-2xl font-extrabold text-[#0E1A30] mt-1">0</h3>
                <p class="text-xs font-bold text-[#0D9488] mt-1">موزعة على المراحل</p>
              </div>
              <div class="w-12 h-12 rounded-2xl bg-[#E6F7F5] text-[#0D9488] flex items-center justify-center shrink-0">
                <i data-lucide="calendar-days" class="w-6 h-6"></i>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70 flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-[#64748B]">الامتحانات المجدولة</span>
                <h3 id="stat-exams" class="text-2xl font-extrabold text-[#0E1A30] mt-1">0</h3>
                <p class="text-xs font-bold text-[#F59E0B] mt-1">اختبارات معتمدة</p>
              </div>
              <div class="w-12 h-12 rounded-2xl bg-amber-50 text-[#F59E0B] flex items-center justify-center shrink-0">
                <i data-lucide="file-clock" class="w-6 h-6"></i>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70 flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-[#64748B]">نسبة الحضور</span>
                <h3 class="text-2xl font-extrabold text-[#0E1A30] mt-1">96.4%</h3>
                <p class="text-xs font-bold text-emerald-600 mt-1">معدل انضباط مرتفع</p>
              </div>
              <div class="w-12 h-12 rounded-2xl bg-[#E6F7F5] text-[#0D9488] flex items-center justify-center shrink-0">
                <i data-lucide="user-check" class="w-6 h-6"></i>
              </div>
            </div>
          </div>

          <!-- جدول سريع لأحدث التحديثات -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200/70 p-5 sm:p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
              <div>
                <h2 class="text-base sm:text-lg font-extrabold text-[#0E1A30]">أحدث التحديثات والأنشطة المدرسية</h2>
                <p class="text-xs text-[#64748B] mt-0.5">ملخص سريع لآخر الرسائل، الحصص، الامتحانات، والإعلانات</p>
              </div>
              <button
                type="button"
                onclick="switchSection('announcements')"
                class="px-4 py-2 rounded-xl bg-[#E6F7F5] hover:bg-[#0D9488] text-[#0D9488] hover:text-white text-xs font-bold transition-colors cursor-pointer self-start sm:self-auto"
              >
                + نشر إعلان جديد
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-right border-collapse">
                <thead>
                  <tr class="bg-[#F4F6F9] text-[#0E1A30] text-xs font-extrabold border-b border-slate-200">
                    <th class="py-3 px-4 rounded-tr-xl">النوع</th>
                    <th class="py-3 px-4">العنوان / التفاصيل</th>
                    <th class="py-3 px-4">التاريخ / الوقت</th>
                    <th class="py-3 px-4 rounded-tl-xl">الحالة</th>
                  </tr>
                </thead>
                <tbody id="overview-updates-tbody" class="divide-y divide-slate-100 text-sm"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ===================================================
             القسم 2: رسائل أولياء الأمور
        ==================================================== -->
        <section id="section-messages" class="dashboard-section hidden space-y-5 fade-in">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200/70 p-5 sm:p-6">
            <!-- شريط البحث والفلترة -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-5 border-b border-slate-100">
              <div>
                <h2 class="text-lg font-extrabold text-[#0E1A30]">صندوق رسائل أولياء الأمور</h2>
                <p class="text-xs text-[#64748B] mt-0.5">استعراض الاستفسارات، البحث فيها، والرد المباشر على أولياء الأمور</p>
              </div>

              <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
                <div class="relative">
                  <input
                    type="text"
                    id="msg-search-input"
                    oninput="renderMessages()"
                    placeholder="ابحث باسم ولي الأمر أو الموضوع..."
                    class="w-full sm:w-64 h-10 pr-9 pl-3 rounded-xl bg-[#F4F6F9] border border-slate-200 text-xs outline-none focus:bg-white focus:border-[#0D9488]"
                  />
                  <i data-lucide="search" class="w-4 h-4 text-[#64748B] absolute right-3 top-3"></i>
                </div>

                <div class="flex items-center gap-1.5 bg-[#F4F6F9] p-1 rounded-xl">
                  <button type="button" onclick="setMessageFilter('all')" data-msg-filter="all" class="msg-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-[#0E1A30] text-white cursor-pointer">
                    الكل
                  </button>
                  <button type="button" onclick="setMessageFilter('جديد')" data-msg-filter="جديد" class="msg-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#64748B] hover:text-[#0E1A30] cursor-pointer">
                    جديد
                  </button>
                  <button type="button" onclick="setMessageFilter('تم الرد')" data-msg-filter="تم الرد" class="msg-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold text-[#64748B] hover:text-[#0E1A30] cursor-pointer">
                    تم الرد
                  </button>
                </div>
              </div>
            </div>

            <!-- شبكة الرسائل ونافذة الرد -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-5">
              <div id="messages-list-container" class="lg:col-span-6 space-y-3 max-h-[560px] overflow-y-auto pl-1"></div>

              <div id="message-reply-box" class="lg:col-span-6 bg-[#F4F6F9] rounded-2xl border border-slate-200/80 p-5 sm:p-6 flex flex-col justify-center min-h-[340px]">
                <div class="text-center text-[#64748B]">
                  <i data-lucide="message-square-reply" class="w-10 h-10 mx-auto mb-2.5 text-[#0D9488] opacity-80"></i>
                  <p class="text-sm font-bold text-[#0E1A30]">اختر رسالة لعرض تفاصيلها وإرسال الرد</p>
                  <p class="text-xs mt-1">سيتم تحديث حالة الرسالة تلقائياً إلى «تم الرد» وحفظها</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ===================================================
             القسم 3: جداول الحصص
        ==================================================== -->
        <section id="section-schedules" class="dashboard-section hidden space-y-6 fade-in">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- نموذج إضافة أو تعديل حصة + رفع CSV -->
            <div class="lg:col-span-5 space-y-5">
              <div class="bg-white rounded-2xl shadow-sm border border-slate-200/70 p-5 sm:p-6">
                <div class="flex items-center justify-between mb-4">
                  <h2 id="schedule-form-title" class="text-base sm:text-lg font-extrabold text-[#0E1A30]">إضافة حصة دراسية</h2>
                  <button type="button" id="cancel-edit-schedule-btn" onclick="resetScheduleForm()" class="hidden text-xs font-bold text-rose-600 hover:underline cursor-pointer">
                    إلغاء التعديل
                  </button>
                </div>

                <form id="schedule-form" class="space-y-3.5" novalidate>
                  <input type="hidden" id="schedule-edit-id" />

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label for="sch-stage" class="block text-xs font-bold text-[#0E1A30] mb-1">المرحلة الدراسية</label>
                      <select id="sch-stage" class="w-full h-11 px-3 rounded-xl bg-[#F4F6F9] border border-slate-200 text-xs font-bold outline-none focus:bg-white focus:border-[#0D9488]">
                        <option value="المرحلة الابتدائية">المرحلة الابتدائية</option>
                        <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
                        <option value="المرحلة الثانوية">المرحلة الثانوية</option>
                      </select>
                    </div>

                    <div>
                      <label for="sch-day" class="block text-xs font-bold text-[#0E1A30] mb-1">اليوم الدراسي</label>

    let state = loadState();

    let currentMsgFilter = 'all';
    let selectedMessageId = null;

    // تحميل البيانات من localStorage مع معالجة الأخطاء بأمان
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          messages: Array.isArray(parsed.messages) ? parsed.messages : structuredClone(defaultState.messages),
          schedules: Array.isArray(parsed.schedules) ? parsed.schedules : structuredClone(defaultState.schedules),
          exams: Array.isArray(parsed.exams) ? parsed.exams : structuredClone(defaultState.exams),
          announcements: Array.isArray(parsed.announcements) ? parsed.announcements : structuredClone(defaultState.announcements),
        };
      } catch (err) {
        return structuredClone(defaultState);
      }
    }

    // حفظ البيانات تلقائياً وتحديث الواجهة
    function saveAndRefresh() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        showToast('تعذر حفظ البيانات في التخزين المحلي', 'error');
      }
      renderAll();
    }

    // عرض إشعار Toast
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styleClass =
        type === 'error'
          ? 'bg-rose-600 text-white'
          : type === 'warning'
          ? 'bg-[#F59E0B] text-[#071727]'
          : 'bg-[#0E1A30] text-white border border-[#0D9488]/50';

      toast.className = `${styleClass} px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2.5 fade-in pointer-events-auto`;
      toast.innerHTML = `
        <i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0 text-[#2DD4BF]"></i>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3200);
    }

    // حماية النصوص المدخلة من XSS عند العرض
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

      const query = (document.getElementById('msg-search-input')?.value || '').trim().toLowerCase();

      const filtered = state.messages.filter((m) => {
        const matchesFilter = currentMsgFilter === 'all' || m.status === currentMsgFilter;
        const matchesSearch =
          !query ||
          m.parentName.toLowerCase().includes(query) ||
          m.subject.toLowerCase().includes(query) ||
          m.body.toLowerCase().includes(query);
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center rounded-2xl border border-dashed border-slate-200 text-xs text-[#64748B]">

    function parseAndImportScheduleRows(rawText) {
      const lines = rawText
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);

      let added = 0;
      lines.forEach((line) => {
        // دعم الفاصلة الإنجليزية والعربية والمنقوطة
        const cols = line.split(/[,،;]/).map((c) => c.trim());
        if (cols.length >= 3) {
          state.schedules.unshift({
            id: 'SCH-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
            stage: cols[0] || 'المرحلة المتوسطة',
            day: cols[1] || 'الأحد',
            subject: cols[2],
            time: cols[3] || '08:00 ص - 08:45 ص',
            teacher: cols[4] || 'هيئة التدريس',
            room: cols[5] || 'قاعة 101',
          });
          added++;
        }
      });

      if (added > 0) {
        saveAndRefresh();
        showToast(`تم استيراد ${added} حصة دراسية بنجاح`);
      } else {
        showToast('لم يتم العثور على سطور صالحة. تأكد من فصل القيم بفاصلة (,)', 'error');
      }
    }

    function importBulkSchedulesFromText() {
      const textarea = document.getElementById('bulk-csv-input');
      const text = textarea.value.trim();
      if (!text) {
        showToast('يرجى لصق بيانات الحصص أولاً', 'error');
        return;
      }
      parseAndImportScheduleRows(text);
      textarea.value = '';
    }

    function handleScheduleCsvFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        parseAndImportScheduleRows(String(e.target.result || ''));
      };
      reader.onerror = () => showToast('تعذر قراءة الملف المحدد', 'error');
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

      showToast('تم حذف موعد الامتحان', 'warning');
    }

    function renderExams() {
      const container = document.getElementById('exams-list-container');
      if (state.exams.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center rounded-2xl border border-dashed border-slate-200 text-xs text-[#64748B]">
            لا توجد مواعيد امتحانات مجدولة حالياً.
          </div>
        `;
        return;
      }

      container.innerHTML = state.exams
        .map(
          (ex) => `
          <div class="p-4 rounded-2xl border border-slate-200/80 bg-[#F4F6F9]/55 hover:bg-white transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="space-y-1">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold bg-amber-100 text-amber-800">${escapeHtml(ex.stage)}</span>
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold bg-[#E6F7F5] text-[#0D9488]">${escapeHtml(ex.date)}</span>
                <span class="text-xs font-bold text-[#64748B]">${escapeHtml(ex.time)}</span>
              </div>
              <h4 class="text-sm sm:text-base font-extrabold text-[#0E1A30]">اختبار ${escapeHtml(ex.subject)}</h4>
              <p class="text-xs text-[#64748B]">القاعة / اللجنة: <strong class="text-[#1E293B]">${escapeHtml(ex.room)}</strong></p>
            </div>

            <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
              <button
                type="button"
                onclick="editExam('${ex.id}')"
                class="px-3 py-1.5 rounded-xl bg-white hover:bg-[#E6F7F5] border border-slate-200 text-xs font-bold text-[#0E1A30] hover:text-[#0D9488] transition-colors cursor-pointer flex items-center gap-1"
              >
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                <span>تعديل</span>
              </button>
              <button
                type="button"
                onclick="deleteExam('${ex.id}')"
                class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white text-xs font-bold transition-colors cursor-pointer flex items-center gap-1"
              >
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>حذف</span>
              </button>
            </div>
          </div>
        `
        )
        .join('');
      lucide.createIcons();
    }

    // =======================================================
    // 5. الإعلانات المدرسية (نشر + حذف)
    // =======================================================
    document.getElementById('announcement-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const title = document.getElementById('ann-title').value.trim();
      const stage = document.getElementById('ann-stage').value;
      const content = document.getElementById('ann-content').value.trim();

      if (!title || !content) {
        showToast('يرجى إدخال عنوان الإعلان ونصه', 'error');
        return;
      }

      const nowTime = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      state.announcements.unshift({
        id: 'ANN-' + Date.now(),
        title,
        stage,
        content,
        date: `اليوم - ${nowTime}`,
      });

      this.reset();
      saveAndRefresh();
      showToast('تم نشر الإعلان المدرسي بنجاح');
    });

    function deleteAnnouncement(id) {
      state.announcements = state.announcements.filter((a) => a.id !== id);
      saveAndRefresh();
      showToast('تم حذف الإعلان', 'warning');
    }

    function renderAnnouncements() {
      const container = document.getElementById('announcements-list-container');
      if (state.announcements.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center rounded-2xl border border-dashed border-slate-200 text-xs text-[#64748B]">
            لا توجد إعلانات مدرسية منشورة حالياً.
          </div>
        `;
        return;
      }

      container.innerHTML = state.announcements
        .map(
          (ann) => `
          <article class="p-4 rounded-2xl border border-slate-200/80 bg-[#F4F6F9]/55 hover:bg-white transition-all space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold bg-[#E6F7F5] text-[#0D9488]">${escapeHtml(ann.stage)}</span>
                <span class="text-[11px] text-[#64748B]">${escapeHtml(ann.date)}</span>
              </div>
              <button
                type="button"
                onclick="deleteAnnouncement('${ann.id}')"
                class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50 transition-colors cursor-pointer"
                title="حذف الإعلان"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <h4 class="text-sm sm:text-base font-extrabold text-[#0E1A30]">${escapeHtml(ann.title)}</h4>
            <p class="text-xs sm:text-sm text-[#1E293B] leading-relaxed">${escapeHtml(ann.content)}</p>
          </article>
        `
        )
        .join('');
      lucide.createIcons();
    }

    // =======================================================
    // إعادة ضبط البيانات الافتراضية
    // =======================================================
    function openResetConfirmModal() {
      document.getElementById('reset-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeResetConfirmModal() {
      document.getElementById('reset-modal').classList.add('hidden');
    }

    function confirmResetDefaultData() {
      state = structuredClone(defaultState);
      selectedMessageId = null;
      resetScheduleForm();
      resetExamForm();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      closeResetConfirmModal();
      document.getElementById('message-reply-box').innerHTML = `
        <div class="text-center text-[#64748B]">
          <i data-lucide="message-square-reply" class="w-10 h-10 mx-auto mb-2.5 text-[#0D9488] opacity-80"></i>
          <p class="text-sm font-bold text-[#0E1A30]">اختر رسالة لعرض تفاصيلها وإرسال الرد</p>
          <p class="text-xs mt-1">سيتم تحديث حالة الرسالة تلقائياً إلى «تم الرد» وحفظها</p>
        </div>
      `;
      renderAll();
      showToast('تمت إعادة ضبط جميع البيانات إلى القيم الافتراضية');
    }

    // تحديث جميع أجزاء لوحة التحكم
    function renderAll() {
      renderOverview();
      renderMessages();
      renderSchedules();
      renderExams();
      renderAnnouncements();
      lucide.createIcons();
    }

    // تهيئة الصفحة عند التحميل
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (sessionStorage.getItem(AUTH_KEY) === 'authenticated') {
        showDashboardView();
      }
    });
  </script>
</body>
</html>
