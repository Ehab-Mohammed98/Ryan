<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول وإعادة تعيين كلمة المرور</title>
  <!-- خط عربي حديث مشابه لتصميم الصورة -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #2b2f38;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: #2d3139;
      margin-bottom: 10px;
    }

    .form-input {
      width: 100%;
      height: 54px;
      padding: 0 18px;
      font-size: 16px;
      color: #2d3139;
      background-color: #ffffff;
      border: 1.5px solid #e2e6ec;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input::placeholder {
      color: #9ba3af;
      font-size: 15px;
    }

    .form-input:focus {
      border-color: #0097a7;
      box-shadow: 0 0 0 3px rgba(0, 151, 167, 0.12);
    }

    /* صف تذكرني ونسيت كلمة المرور */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -6px;
      margin-bottom: 24px;
      font-size: 15px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7c8594;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #0097a7;
      border: 1.5px solid #c5cbd3;
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      color: #0097a7;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .forgot-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background-color: #0097a7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #00838f;
    }

    .helper-text {
      font-size: 14px;
      color: #7c8594;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- نموذج تسجيل الدخول -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="national-id">رقم الهوية / الرقم الأكاديمي</label>
        <input
          type="text"
          id="national-id"
          class="form-input"
          placeholder="أدخل رقم الهوية"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="•••••••••"
          required
        />
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" />
          <span>تذكرني</span>
        </label>

        <a href="#reset" class="forgot-link" onclick="toggleForms(true); return false;">
          نسيت كلمة المرور؟
        </a>
      </div>

      <button type="submit" class="btn-submit">تسجيل الدخول</button>
    </form>

    <!-- نموذج إعادة إنشاء كلمة المرور -->
    <form id="reset-form" class="hidden">
      <p class="helper-text">
        أدخل رقم الهوية أو الرقم الأكاديمي وكلمة المرور الجديدة لإعادة تعيين كلمة المرور.
      </p>

      <div class="form-group">
        <label class="form-label" for="reset-id">رقم الهوية / الرقم الأكاديمي</label>
        <input
          type="text"
          id="reset-id"
          class="form-input"
          placeholder="أدخل رقم الهوية"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="new-password">كلمة المرور الجديدة</label>
        <input
          type="password"
          id="new-password"
          class="form-input"
          placeholder="أدخل كلمة المرور الجديدة"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">تأكيد كلمة المرور الجديدة</label>
        <input
          type="password"
          id="confirm-password"
          class="form-input"
          placeholder="أعد كتابة كلمة المرور الجديدة"
          required
        />
      </div>

      <button type="submit" class="btn-submit">إعادة إنشاء كلمة المرور</button>

      <div style="text-align: center; margin-top: 16px;">
        <a href="#login" class="forgot-link" onclick="toggleForms(false); return false;">
          العودة إلى تسجيل الدخول
        </a>
        <p id="login-message"
   style="text-align:center; margin-top:15px;">
</p>
      </div>
    </form>
  </div>

  <script>
    function toggleForms(showReset) {
      const loginForm = document.getElementById('login-form');
      const resetForm = document.getElementById('reset-form');
      if (showReset) {
        loginForm.classList.add('hidden');
        resetForm.classList.remove('hidden');
      } else {
        resetForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
      }
    }
  </script>
<script type="module" src="Js/login.js"></script>
</body>
</html>
