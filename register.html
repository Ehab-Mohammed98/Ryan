<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التسجيل والقبول - مدرسة الريان</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/registers.css">
</head>
<body>

  <section class="registration-section">
    <div class="reg-container">
      
      <div class="reg-header">
        <a href="index.html" class="top-back-link">← العودة للرئيسية</a>
        <span class="reg-badge">العام الدراسي 2026 - 2027</span>
        <h2>نموذج طلب تسجيل طالب جديد</h2>
        <p>يرجى تعبئة البيانات بدقة، وسيقوم فريق القبول والتسجيل في مدرسة الريان بالتواصل معكم لإتمام الإجراءات.</p>
      </div>

      <form class="reg-form" action="#" method="POST">
        
        <!-- 1. بيانات الطالب -->
        <div class="form-block">
          <div class="block-title">
            <span class="step-num">1</span>
            <h3>بيانات الطالب</h3>
          </div>

          <div class="grid-2">
            <div class="input-box">
              <label for="studentName">اسم الطالب الرباعي <span>*</span></label>
              <input type="text" id="studentName" placeholder="أدخل اسم الطالب كاملاً" required>
            </div>

            <div class="input-box">
              <label for="idNumber">رقم الهوية الوطنية / الإقامة <span>*</span></label>
              <input type="text" id="idNumber" placeholder="10xxxxxxxx" maxlength="10" required>
            </div>
          </div>

          <div class="grid-3">
            <div class="input-box">
              <label for="birthDate">تاريخ الميلاد <span>*</span></label>
              <input type="date" id="birthDate" required>
            </div>

            <div class="input-box">
              <label for="nationality">الجنسية <span>*</span></label>
              <input type="text" id="nationality" placeholder="مثال: سعودي" required>
            </div>

            <div class="input-box">
              <label for="gender">الجنس <span>*</span></label>
              <select id="gender" required>
                <option value="" disabled selected>اختر...</option>
                <option value="male">بنين</option>
                <option value="female">بنات</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 2. المرحلة الدراسية -->
        <div class="form-block">
          <div class="block-title">
            <span class="step-num">2</span>
            <h3>المرحلة الدراسية المطلوبة</h3>
          </div>

          <div class="grid-3">
            <div class="input-box">
              <label for="stage">المرحلة الدراسية <span>*</span></label>
              <select id="stage" required>
                <option value="" disabled selected>اختر المرحلة...</option>
                <option value="kg">رياض الأطفال (تمهيدي)</option>
                <option value="primary">المرحلة الابتدائية</option>
                <option value="middle">المرحلة المتوسطة</option>
                <option value="high">المرحلة الثانوية</option>
              </select>
            </div>

            <div class="input-box">
              <label for="grade">الصف الدراسي <span>*</span></label>
              <select id="grade" required>
                <option value="" disabled selected>اختر الصف...</option>
                <option value="1">الصف الأول</option>
                <option value="2">الصف الثاني</option>
                <option value="3">الصف الثالث</option>
                <option value="4">الصف الرابع</option>
                <option value="5">الصف الخامس</option>
                <option value="6">الصف السادس</option>
              </select>
            </div>

            <div class="input-box">
              <label for="prevSchool">المدرسة السابقة (إن وجدت)</label>
              <input type="text" id="prevSchool" placeholder="اسم المدرسة السابقة">
            </div>
          </div>
        </div>

        <!-- 3. بيانات ولي الأمر -->
        <div class="form-block">
          <div class="block-title">
            <span class="step-num">3</span>
            <h3>بيانات ولي الأمر والتواصل</h3>
          </div>

          <div class="grid-2">
            <div class="input-box">
              <label for="parentName">اسم ولي الأمر <span>*</span></label>
              <input type="text" id="parentName" placeholder="الاسم الكامل لولي الأمر" required>
            </div>

            <div class="input-box">
              <label for="relation">صلة القرابة <span>*</span></label>
              <select id="relation" required>
                <option value="father">الأب</option>
                <option value="mother">الأم</option>
                <option value="other">وكيل شرعي / قريب</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="input-box">
              <label for="mobile">رقم الجوال (واتساب) <span>*</span></label>
              <input type="tel" id="mobile" placeholder="05xxxxxxxx" required>
            </div>

            <div class="input-box">
              <label for="parentEmail">البريد الإلكتروني</label>
              <input type="email" id="parentEmail" placeholder="example@domain.com">
            </div>
          </div>

          <div class="input-box">
            <label for="notes">ملاحظات إضافية أو احتياجات خاصة للطالب</label>
            <textarea id="notes" rows="3" placeholder="اكتب أي ملاحظات صحية أو تعليمية تود إخبارنا بها..."></textarea>
          </div>
        </div>

        <!-- الموافقة وزر الإرسال -->
        <div class="form-footer">
          <label class="checkbox-label">
            <input type="checkbox" required>
            <span>أقر بصحة جميع البيانات المدخلة أعلاه وأوافق على سياسة القبول والتسجيل في المدرسة.</span>
          </label>

          <button type="submit" class="btn-register">إرسال طلب التسجيل</button>
        </div>

      </form>
    </div>
  </section>

</body>
</html>
